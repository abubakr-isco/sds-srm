# Host nginx site for the CRM with HTTPS (certificate from certbot --webroot).
server {
    listen 80;
    listen [::]:80;
    server_name srm.sdsuz-inc.com;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name srm.sdsuz-inc.com;

    ssl_certificate /etc/letsencrypt/live/srm.sdsuz-inc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srm.sdsuz-inc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Browsers must use HTTPS for this host for a year (subdomains are not included: the
    # other sites on sdsuz-inc.com are not ours to force).
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
