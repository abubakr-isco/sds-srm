# Host nginx site for the CRM when the server already runs nginx (instead of the Caddy profile).
# Stage 1 (HTTP only): serves the Let's Encrypt challenge so certbot can issue the certificate.
# deploy/server-setup.sh replaces it with nginx-srm-ssl.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name srm.sdsuz-inc.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
