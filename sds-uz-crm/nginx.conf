# Serves the built SPA and proxies /api to the backend on the same origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 3m;  # the API accepts JSON bodies up to 2 MB

  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # index.html must always be revalidated so users get new releases.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
